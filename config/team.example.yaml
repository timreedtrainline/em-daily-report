team:
  name: "Example Engineering Team"
  manager: "Example Manager"

github:
  organization: "example-org"
  repositories:
    - "example-service"
    - "example-library"
  engineers:
    - name: "Engineer One"
      github: "engineer-one"
    - name: "Engineer Two"
      github: "engineer-two"

jira:
  base_url: "https://example.atlassian.net/"
  projects:
    - "ENG"
  statuses:
    in_progress:
      - "In Progress"
    in_review:
      - "In Review"
    blocked:
      - "Blocked"
    done:
      - "Done"

slack:
  team_channels:
    - "team-example-platform"
    - "team-example-reviews"
  management_channels: []
  office_and_networks_channels: []
  ai_channels: []

rules:
  stagnation_days: 2
  completed_window: "since_previous_report"
  briefing_cutoff_local_time: "09:15"

llm:
  enabled: false
  use_for:
    - "final_review"
