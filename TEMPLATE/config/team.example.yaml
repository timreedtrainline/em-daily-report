# Copy this file to team.yaml and replace all placeholder values.

team:
  name: "Example Engineering Team"
  manager: "Example Manager"

sources:
  pull_requests:
    provider: "github"
  tickets:
    provider: "jira"
  meetings:
    provider: "outlook"
  messaging:
    provider: "slack"

github:
  organization: "example-org"
  repositories:
    - "example-service"
    - "example-library"
  engineers:
    - name: "Engineer One"
      github: "engineer-one"
    - name: "Engineer Two"
      github: "engineer-two"

jira:
  base_url: "https://example.atlassian.net"
  projects:
    - "ENG"
  statuses:
    in_progress:
      - "In Progress"
    in_review:
      - "In Review"
    blocked:
      - "Blocked"
    done:
      - "Done"

slack:
  team_channels:
    - "example-team-channel"
  non_team_channel_allowlist: []

outlook:
  included_calendars:
    - "Primary"

rules:
  stagnation_days: 2
  completed_window: "since_previous_report"
